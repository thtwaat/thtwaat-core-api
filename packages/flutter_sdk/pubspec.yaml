name: thtwaat_flutter
description: Official Flutter / Dart SDK for the THTWAAT AI Platform. Chat, streaming, auth, knowledge, agents, marketplace, and more — zero backend changes.
version: 1.0.0
homepage: https://github.com/thtwaat/thtwaat-core-api
repository: https://github.com/thtwaat/thtwaat-core-api/tree/main/packages/flutter_sdk
issue_tracker: https://github.com/thtwaat/thtwaat-core-api/issues
documentation: https://docs.thtwaat.com

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
