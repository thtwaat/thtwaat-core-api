# THTWAAT Deploy — Vite build sandbox egress allowlist.
#
# A plain forward proxy allowlisted by CONNECT target hostname. HTTPS
# CONNECT requests carry their target hostname:port in the request line
# itself (`CONNECT registry.npmjs.org:443 HTTP/1.1`) — Squid can allow/deny
# by that hostname without ever decrypting the tunnel, so this proxy never
# sees npm registry responses or request bodies. No TLS interception, no
# generated CA cert, nothing more exotic than a standard allowlisted CONNECT
# proxy.
#
# This file alone does NOT force build containers through this proxy — see
# docker/vite-build/egress-proxy/README.md for the still-required host
# firewall rule. Without that rule, HTTP_PROXY/HTTPS_PROXY are cooperative
# only: a malicious postinstall script can simply ignore them and connect
# directly, same as if this proxy didn't exist.

http_port 3128
# Non-root USER in the Dockerfile can't write the default /run/squid.pid.
pid_filename /tmp/squid.pid

# Leading "." matches the domain itself and all subdomains (registry.npmjs.org,
# npmjs.org, etc.) — listing the bare hostname too is redundant and Squid
# rejects the config outright ("is a subdomain of") if you do.
acl allowed_registry dstdomain .npmjs.org .npmjs.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT allowed_registry SSL_ports
http_access deny CONNECT
http_access allow allowed_registry
http_access deny all

# Never cache — package installs must always see the real, current registry
# state; caching here would also mean this proxy quietly holds a copy of
# whatever gets fetched, which is unnecessary given it's tossed with the
# ephemeral build container regardless.
cache deny all

access_log /var/log/squid/access.log squid
