# Production stack — Docker Compose v2 ONLY (Docker Engine 29+)
# Do NOT use legacy docker-compose 1.x (KeyError: ContainerConfig on Engine 29).
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Services: nginx, web_app, api, postgres, redis, worker, scheduler, backup
# Network: thtwaat_net (shared; service DNS: web_app, api, nginx, …)
# Containers: thtwaat-nginx, thtwaat-web-app, thtwaat-api, …

name: thtwaat

networks:
  # Shared host network (create once if missing):
  #   docker network create thtwaat_net
  thtwaat_net:
    name: thtwaat_net
    external: true

services:
  nginx:
    container_name: thtwaat-nginx
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/conf.d/domains:/etc/nginx/conf.d/domains:ro
      - ./nginx/acme-webroot:/var/www/acme:ro
    networks:
      - thtwaat_net
    depends_on:
      api:
        condition: service_healthy
      web_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # SaaS frontend — https://app.thtwaat.com (internal only; TLS at nginx)
  web_app:
    container_name: thtwaat-web-app
    build:
      context: ./apps/templates/saas
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.thtwaat.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://app.thtwaat.com}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-THTWAAT}
        NEXT_PUBLIC_BRAND_COLOR: ${NEXT_PUBLIC_BRAND_COLOR:-#0f766e}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    expose:
      - "3300"
    networks:
      - thtwaat_net
    environment:
      NODE_ENV: production
      PORT: "3300"
      # Must be forced again in Dockerfile CMD — Docker overwrites HOSTNAME with container id.
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3300/',(r)=>{r.resume();process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    container_name: thtwaat-api
    build: .
    # Container env must match the production env file used at deploy
    # (`docker compose ... --env-file .env.prod`). `--env-file` only
    # substitutes ${VAR} in this YAML; it does NOT inject into the container.
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      SSL_MODE: ${SSL_MODE:-simulate}
      REDIS_HOST: redis
      DB_HOST: db
      PYTHONPATH: /app
      # In-stack Ollama daemon (do not inherit host.docker.internal from .env).
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/knowledge:/app/data/knowledge
      - ./data/backups:/app/data/backups
      - ./nginx/ssl:/app/nginx/ssl
      - ./nginx/conf.d/domains:/app/nginx/conf.d/domains
      - ./nginx/acme-webroot:/app/nginx/acme-webroot
    networks:
      - thtwaat_net
    command: >
      bash -c "alembic upgrade head &&
               python -m scripts.seed_marketplace --no-refresh &&
               uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      # alembic upgrade + uvicorn import often exceeds 20s on cold start;
      # keep /live as the probe (no Redis/DB) so liveness ≠ readiness.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false

  ollama:
    container_name: thtwaat-ollama
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - thtwaat_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Keep the daemon internal; scrapers / apps talk to it via the docker network.
    expose:
      - "11434"

  worker:
    container_name: thtwaat-worker
    build: .
    env_file:
      - .env.prod
    environment:
      REDIS_HOST: redis
      DB_HOST: db
      SSL_MODE: ${SSL_MODE:-simulate}
      OLLAMA_URL: http://ollama:11434
      PYTHONPATH: /app
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/knowledge:/app/data/knowledge
      - ./data/backups:/app/data/backups
      - ./nginx/ssl:/app/nginx/ssl
      - ./nginx/conf.d/domains:/app/nginx/conf.d/domains
    networks:
      - thtwaat_net
    command: python scripts/worker.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; r=redis.from_url(f\"redis://{os.getenv('REDIS_HOST','redis')}:6379\"); assert r.get('thtwaat:worker:heartbeat')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    container_name: thtwaat-scheduler
    build: .
    env_file:
      - .env.prod
    environment:
      REDIS_HOST: redis
      DB_HOST: db
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-300}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      PYTHONPATH: /app
    volumes:
      - ./data/backups:/app/data/backups
      - ./data/uploads:/app/data/uploads
      - ./data/knowledge:/app/data/knowledge
      - ./nginx/ssl:/app/nginx/ssl
      - ./nginx/conf.d/domains:/app/nginx/conf.d/domains
    networks:
      - thtwaat_net
    command: python scripts/scheduler.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup:
    container_name: thtwaat-backup
    build: .
    env_file:
      - .env.prod
    environment:
      REDIS_HOST: redis
      DB_HOST: db
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      PYTHONPATH: /app
    volumes:
      - ./data/backups:/app/data/backups
      - ./data/uploads:/app/data/uploads
      - ./data/knowledge:/app/data/knowledge
      - pgdata:/var/lib/postgresql/data:ro
    networks:
      - thtwaat_net
    profiles: ["manual-backup"]
    command: python scripts/backup.py
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: thtwaat-db
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - thtwaat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: thtwaat-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - thtwaat_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollamadata:
