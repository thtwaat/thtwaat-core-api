worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting
    # Dashboard pages fire several parallel API calls; 10r/s was tripping 429s on Add Domain.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Real IP from trusted proxies (Docker / load balancer)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # Generated per-domain vhosts (SSL Manager + platform hosts)
    # app.thtwaat.com → compose service web_app:3300 (see conf.d/domains/app.thtwaat.com.conf)
    include /etc/nginx/conf.d/domains/*.conf;

    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt HTTP-01
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        location /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
        }

        location /live {
            proxy_pass http://api_backend/live;
        }

        location /ready {
            proxy_pass http://api_backend/ready;
        }

        # Prometheus series are scraped over the internal docker network only.
        location = /metrics {
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'" always;

        client_max_body_size 50m;

        # Prometheus series are scraped over the internal docker network only.
        location = /metrics {
            deny all;
        }

        location / {
            limit_req zone=api_limit burst=40 nodelay;

            # Re-resolve api after container recreate (static upstream IPs go stale).
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
