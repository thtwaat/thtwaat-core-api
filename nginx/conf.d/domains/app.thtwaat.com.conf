# https://app.thtwaat.com → SaaS frontend (web_app:3300)
# TLS certs: Let's Encrypt copies under nginx/ssl/domains/app.thtwaat.com/

server {
    listen 80;
    server_name app.thtwaat.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.thtwaat.com;

    ssl_certificate     /etc/nginx/ssl/domains/app.thtwaat.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/domains/app.thtwaat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
