# https://api.thtwaat.com → FastAPI (api:8000)
# TLS: place LE certs under nginx/ssl/domains/api.thtwaat.com/
# (fullchain.pem + privkey.pem), or symlink from /etc/letsencrypt/live/...
#
# Variable proxy_pass + Docker DNS so upstream IP re-resolves after api recreate.

server {
    listen 80;
    server_name api.thtwaat.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.thtwaat.com;

    ssl_certificate     /etc/nginx/ssl/domains/api.thtwaat.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/domains/api.thtwaat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;

    location = /metrics {
        deny all;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        # THTWAAT Deploy — the Vite build sandbox runs synchronously inside
        # the request/response cycle for POST .../static-sites/{id}/upload
        # (VITE_MAX_BUILD_TIME_SECONDS, default 300s in app/config/settings.py)
        # — 120s was shorter than that, so nginx could 504 a client mid-build
        # while the backend kept building regardless (Phase 2 staging
        # validation report §12). 330s = 300s build budget + margin. This is
        # a stopgap, not the fix: moving Vite builds off the synchronous
        # request path (a background job + the existing SSE
        # /deployments/{id}/stream endpoint for status) is the real fix and
        # is explicitly out of scope for this phase — see the report's §12
        # for the full risk writeup (duplicate requests, browser disconnects
        # not stopping the build, etc.) and §6 for the idempotency mitigation
        # that is in scope this phase.
        proxy_read_timeout 330s;
    }
}
