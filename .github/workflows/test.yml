name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JWT_SECRET_KEY: ci-test-jwt-secret-key-32characters!
  JWT_REFRESH_SECRET_KEY: ci-test-refresh-secret-key-32chars!
  APP_ENV: test
  STORAGE_PROVIDER: local
  SSL_MODE: simulate

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.12.7
      - name: Ruff check
        run: ruff check tests/support tests/unit tests/e2e tests/conftest.py --config ruff.toml --output-format=github

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          chmod +x scripts/*.sh deploy/*.sh bootstrap.sh || true
          mkdir -p reports
          python -m pytest -m unit -q \
            --cov=app \
            --cov-report=xml:reports/coverage-unit.xml \
            --cov-report=term \
            --junitxml=reports/junit-unit.xml \
            --timeout=60
      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            reports/coverage-unit.xml
            reports/junit-unit.xml
          if-no-files-found: warn

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t thtwaat-core-api:ci .
      - name: Smoke image import
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32characters!
          JWT_REFRESH_SECRET_KEY: ci-test-refresh-secret-key-32chars!
        run: |
          docker run --rm \
            -e JWT_SECRET_KEY \
            -e JWT_REFRESH_SECRET_KEY \
            -e APP_ENV=test \
            -e STORAGE_PROVIDER=local \
            -e SSL_MODE=simulate \
            -e DB_HOST=localhost \
            -e DB_USER=thtwaat \
            -e DB_PASSWORD=thtwaat \
            -e DB_NAME=thtwaat \
            thtwaat-core-api:ci \
            python -c "import main; print('import-ok')"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit, build]
    env:
      DATABASE_URL: postgresql://thtwaat:thtwaat@localhost:5433/thtwaat_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_USER: thtwaat
      DB_PASSWORD: thtwaat
      DB_NAME: thtwaat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start Postgres + Redis
        run: docker compose -f docker-compose.test.yml up -d db redis
      - name: Wait for services
        run: |
          python - <<'PY'
          from tests.support import wait_for_tcp, parse_host_port_from_database_url, postgres_dsn_from_env, redis_host_port
          host, port = parse_host_port_from_database_url(postgres_dsn_from_env())
          rh, rp = redis_host_port()
          assert wait_for_tcp(host, port, timeout=90), "postgres"
          assert wait_for_tcp(rh, rp, timeout=90), "redis"
          print("ready")
          PY
      - name: Migrate database
        run: alembic upgrade head
      - name: Run integration flows
        run: |
          mkdir -p reports
          # CI runs the dedicated integration package only (legacy module suite is local/docker-full).
          python -m pytest tests/integration -q \
            --junitxml=reports/junit-integration.xml \
            --timeout=120
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: reports/junit-integration.xml
          if-no-files-found: warn
      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
