name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"
      skip_monitoring:
        description: "Skip monitoring verification"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=production,enable=${{ github.ref_type == 'tag' }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_PATH: ${{ secrets.PROD_APP_PATH }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          SKIP_MON: ${{ github.event.inputs.skip_monitoring }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: PROD_APP_PATH,DEPLOY_REF,IMAGE_TAG,SKIP_MON
          script_stop: true
          script: |
            set -euo pipefail
            APP_PATH="${PROD_APP_PATH:-/opt/thtwaat}"
            cd "${APP_PATH}"
            export ENV_FILE="${ENV_FILE:-.env.prod}"
            export DEPLOY_REF
            export VERIFY_MONITORING=1
            if [ "${SKIP_MON:-false}" = "true" ]; then
              export VERIFY_MONITORING=0
            fi
            export ALLOW_BACKUP_FAILURE=0
            export BACKUP_BEFORE_DEPLOY=1
            git fetch --all --tags
            ./deploy/deploy.sh

      - name: Remote health gate
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_PATH: ${{ secrets.PROD_APP_PATH }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: PROD_APP_PATH
          script_stop: true
          script: |
            set -euo pipefail
            APP_PATH="${PROD_APP_PATH:-/opt/thtwaat}"
            cd "${APP_PATH}"
            ./deploy/verify-health.sh

  rollback-on-failure:
    name: Rollback on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production
    steps:
      - name: Rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_PATH: ${{ secrets.PROD_APP_PATH }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: PROD_APP_PATH
          script: |
            set -euo pipefail
            APP_PATH="${PROD_APP_PATH:-/opt/thtwaat}"
            cd "${APP_PATH}"
            ./deploy/rollback.sh || true
