[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: fast tests — no Docker; SQLite/mocks only
    integration: requires PostgreSQL + Redis (Docker Compose test stack)
    e2e: end-to-end against a deployed API (E2E_BASE_URL)

# Default: collect everything; scripts/CI select via -m
addopts =
    --strict-markers
    -ra
