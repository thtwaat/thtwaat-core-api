<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THTWAAT Widget — Vanilla</title>
  </head>
  <body>
    <h1>Vanilla HTML example</h1>
    <p>Replace data-api-key with a published agent key.</p>
    <script
      src="http://localhost:8000/widget.js"
      data-api-key="tht_live_REPLACE"
      data-theme="light"
      data-position="bottom-right"
      data-primary-color="#111827"
      data-welcome="Hi! Ask me anything."
      data-prompts="Pricing?|Book appointment|Contact support"
    ></script>
  </body>
</html>
